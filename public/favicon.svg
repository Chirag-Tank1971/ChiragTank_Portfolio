<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="ctHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="140" fill="url(#ctGrad)" />
  
  <!-- Subtle top highlight overlay -->
  <rect x="6" y="6" width="500" height="250" rx="134" fill="url(#ctHighlight)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="132" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="12" />

  <!-- Monogram CT -->
  <text
    x="256"
    y="280"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#ffffff"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif"
    font-size="240"
    font-weight="900"
    letter-spacing="-14"
  >CT</text>
</svg>
